<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1118"><title>TOUCHLINE STUDIO</title>
<style>
:root{color-scheme:dark;--bg:#0b1118;--panel:#121e29;--line:#293b49;--muted:#94a8b8;--text:#eef5f8;--green:#39d99a;--blue:#72b4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:#1b2a37;color:var(--text);padding:9px 12px;border-radius:9px;cursor:pointer;font-weight:650}button:hover{border-color:var(--green)}button.primary{background:var(--green);color:#07150f;border-color:var(--green)}button:disabled{opacity:.45;cursor:not-allowed}header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);background:#0e1720;position:sticky;top:0;z-index:3}.logo{font-weight:950;letter-spacing:.13em}.logo span{color:var(--green)}.tag{font-size:10px;color:#a4f0ce;border:1px solid #285a45;border-radius:30px;padding:5px 9px;margin-right:8px}.layout{max-width:1700px;margin:auto;padding:14px;display:grid;grid-template-columns:260px minmax(300px,1fr) 320px;gap:13px;min-height:calc(100vh - 62px)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.head{padding:13px 15px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.12em;font-weight:850;color:#b8c9d4}.pad{padding:14px}.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:#b2c4d0;font-weight:800;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#0c1620;color:var(--text);padding:9px;border-radius:8px;outline:none}.field textarea{min-height:75px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--green)}.muted{color:var(--muted);font-size:11px}.scene{display:flex;gap:9px;width:100%;text-align:left;margin-bottom:7px;background:#0e1923}.scene.active{border-color:var(--green);background:#14271f}.num{background:#293c4a;border-radius:7px;padding:5px 7px}.main{min-width:0;display:flex;flex-direction:column;gap:12px}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.stage{background:radial-gradient(ellipse,#1b2b38,#0d151d 70%);border:1px solid var(--line);border-radius:14px;min-height:580px;display:flex;justify-content:center;padding:14px}canvas{width:min(100%,340px);height:auto;aspect-ratio:9/16;border-radius:8px;background:#101a23;box-shadow:0 15px 45px #0008}.timeline{display:flex;gap:7px;overflow:auto;padding:8px 0}.tile{min-width:110px;text-align:left;font-size:11px;background:#0e1923}.tile.active{border-color:var(--green)}.tile b{display:block}.actions{display:flex;gap:7px;flex-wrap:wrap}.section{font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:850;margin:17px 0 8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{font-size:11px;color:#b9c9d2;min-height:20px;margin-top:8px}.danger{color:#ff9eaa}.hint{padding:10px;background:#10271f;border:1px solid #285a45;border-radius:9px;font-size:11px;color:#bcebd5}.right .pad{max-height:calc(100vh - 110px);overflow:auto}@media(max-width:1100px){.layout{grid-template-columns:220px minmax(280px,1fr)}.right{grid-column:1/-1}.right .pad{max-height:none;display:grid;grid-template-columns:1fr 1fr;gap:0 14px}}@media(max-width:720px){header{padding:0 12px}.layout{display:flex;flex-direction:column;padding:8px}.main{order:1}.left{order:2}.right{order:3}.stage{min-height:0;padding:8px}.right .pad{display:block}canvas{width:min(100%,300px)}}
</style></head><body>
<header><div class="logo">TOUCHLINE <span>STUDIO</span></div><div><span class="tag">BETA · LOKAL</span><button id="new">Neues Projekt</button></div></header>
<div class="layout">
<aside class="panel left"><div class="head">PROJEKT & SZENEN</div><div class="pad">
<div class="field"><label>VIDEOTITEL</label><input id="projectTitle" value="MATCH ANALYSIS"></div><div class="field"><label>UNTERTITEL</label><input id="projectSub" value="TACTICAL BREAKDOWN"></div>
<div class="section">Szenen</div><div id="sceneList"></div><div class="actions"><button class="primary" id="add">+ Szene</button><button id="duplicate">Kopieren</button></div>
<div class="section">Hinweis</div><p class="muted">Alle Inhalte werden lokal im Browser bearbeitet. Statistikwerte sind manuelle Eingaben und müssen vor Veröffentlichung geprüft und belegt werden.</p>
</div></aside>
<main class="main"><div class="bar"><div><b>Videovorschau</b><div class="muted">9:16 · 1080 × 1920 · TikTok / Reels / Shorts</div></div><div class="actions"><button id="prev">←</button><button id="next">→</button><button id="play">▶ Vorschau</button></div></div>
<div class="stage"><canvas id="canvas" width="1080" height="1920"></canvas></div>
<div class="panel pad"><div class="bar"><b>Timeline</b><span class="muted" id="duration"></span></div><div class="timeline" id="timeline"></div><div class="actions"><button class="primary" id="export">Video exportieren (WebM)</button><button id="save">Projekt exportieren</button><button id="load">Projekt importieren</button></div><div class="status" id="status"></div></div></main>
<aside class="panel right"><div class="head">SZENE BEARBEITEN</div><div class="pad" id="editor"></div></aside>
</div>
<script>
const templates={
hook:{type:'hook',name:'Hook',eyebrow:'MATCHDAY',title:'DIESES DUELL ENTSCHEIDET DAS SPIEL',body:'Welche Mannschaft kontrolliert die entscheidenden Räume?',duration:5},
stats:{type:'stats',name:'Statistikvergleich',eyebrow:'DIE ZAHLEN',title:'WER HAT DEN VORTEIL?',teamA:'HEIMTEAM',teamB:'AUSWÄRTSTEAM',stats:[['xG','0,0','0,0'],['Torschüsse','0','0'],['Ballbesitz','0 %','0 %'],['Passquote','0 %','0 %']],duration:7},
tactics:{type:'tactics',name:'Taktiktafel',eyebrow:'TAKTIK-CHECK',title:'RÄUME ZWISCHEN DEN LINIEN',body:'Formation und Laufwege beschreiben. Datenquelle und Spielsituation ergänzen.',formationA:'4-2-3-1',formationB:'4-3-3',duration:8},
player:{type:'player',name:'Spieler im Fokus',eyebrow:'PLAYER SPOTLIGHT',title:'DER SCHLÜSSELSPIELER',player:'SPIELERNAME',role:'ROLLE / POSITION',stat1:'0 Key Passes',stat2:'0 erfolgreiche Dribblings',body:'Einordnung: Stärken, Schwächen und taktische Aufgabe.',duration:7},
prediction:{type:'prediction',name:'Prognose',eyebrow:'UNSERE EINSCHÄTZUNG',title:'WIE KÖNNTE DAS SPIEL LAUFEN?',body:'Begründete Prognose auf Basis der gezeigten Daten.',home:40,draw:30,away:30,duration:6}
};
let scenes=structuredClone([templates.hook,templates.stats,templates.tactics,templates.player,templates.prediction]),active=0,playing=false;
const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d');
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const cur=()=>scenes[active];
function rr(x,y,w,h,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function txt(s,x,y,size,col='#f2f6f8',weight=800,align='left'){ctx.fillStyle=col;ctx.font=weight+' '+size+'px Inter,system-ui,sans-serif';ctx.textAlign=align;ctx.fillText(String(s??''),x,y)}
function lines(s,x,y,max,size,col='#f2f6f8'){ctx.font='850 '+size+'px Inter,system-ui';ctx.fillStyle=col;let line='',yy=y;for(const w of String(s??'').split(/\s+/)){let t=line+w+' ';if(ctx.measureText(t).width>max&&line){ctx.fillText(line.trim(),x,yy);line=w+' ';yy+=size*1.2}else line=t}if(line)ctx.fillText(line.trim(),x,yy);return yy}
function pitch(){rr(72,680,936,850,24,'#0d563c');ctx.strokeStyle='#b8e4cf';ctx.globalAlpha=.65;ctx.lineWidth=4;ctx.strokeRect(110,715,860,780);ctx.beginPath();ctx.moveTo(540,715);ctx.lineTo(540,1495);ctx.stroke();ctx.beginPath();ctx.arc(540,1105,115,0,7);ctx.stroke();ctx.strokeRect(315,715,450,145);ctx.strokeRect(315,1350,450,145);ctx.globalAlpha=1;[[280,880],[440,850],[610,850],[790,880],[380,1080],[700,1080],[250,1300],[430,1330],[650,1330],[830,1300]].forEach((p,i)=>{ctx.fillStyle=i<4?'#76baff':'#f5f8fa';ctx.beginPath();ctx.arc(p[0],p[1],20,0,7);ctx.fill()});}
function render(){let s=cur();ctx.clearRect(0,0,1080,1920);ctx.fillStyle='#101a23';ctx.fillRect(0,0,1080,1920);ctx.fillStyle='#142631';ctx.beginPath();ctx.arc(930,180,440,0,7);ctx.fill();ctx.fillStyle='#102b22';ctx.beginPath();ctx.arc(60,1780,400,0,7);ctx.fill();rr(72,105,76,9,4,'#39d99a');txt('TOUCHLINE / MATCH ANALYSIS',72,170,26,'#b7c8d2');txt(s.eyebrow||'ANALYSIS',72,285,27,'#39d99a',900);let y=lines(s.title,72,400,920,72);if(s.type==='hook'||s.type==='prediction'){lines(s.body,82,Math.max(680,y+180),880,42,'#c2d0d8')}if(s.type==='stats'){let yy=690;txt(s.teamA,110,yy,32,'#72b4ff');txt(s.teamB,970,yy,32,'#39d99a',850,'right');(s.stats||[]).forEach((r,i)=>{let py=yy+110+i*155;rr(85,py-55,910,112,17,'#1a2a36');txt(r[0],540,py+8,31,'#f0f5f7',800,'center');txt(r[1],130,py+8,34,'#72b4ff');txt(r[2],950,py+8,34,'#39d99a',800,'right')})}if(s.type==='tactics'){pitch();txt('BLAU · '+(s.formationA||''),100,645,24,'#72b4ff');txt('WEISS · '+(s.formationB||''),980,645,24,'#fff',800,'right');lines(s.body,90,1620,900,32,'#d0dce2')}if(s.type==='player'){rr(75,700,930,760,28,'#1b2b37');txt(s.player,115,820,56,'#39d99a');txt(s.role,115,900,27,'#9eb1bf');txt(s.stat1,115,1080,40);txt(s.stat2,115,1190,40);lines(s.body,115,1350,820,30,'#c3d1d9')}if(s.type==='prediction'){let vals=[+s.home||0,+s.draw||0,+s.away||0],labs=['HEIMSIEG','REMIS','AUSWÄRTS'];vals.forEach((v,i)=>{let yy=850+i*190;txt(labs[i],95,yy,27);rr(95,yy+28,890,24,12,'#2b3b47');rr(95,yy+28,890*Math.max(0,Math.min(100,v))/100,24,12,['#72b4ff','#a9bac5','#39d99a'][i]);txt(v+'%',975,yy+4,32,'#fff',850,'right')})}txt($('projectTitle').value||'MATCH ANALYSIS',72,1815,24,'#9fb1bd');txt(String(active+1).padStart(2,'0')+' / '+scenes.length,1008,1815,24,'#9fb1bd',800,'right');rr(72,1850,936,5,3,'#293a46');rr(72,1850,936*(active+1)/scenes.length,5,3,'#39d99a')}
function lists(){$('sceneList').innerHTML='';$('timeline').innerHTML='';scenes.forEach((s,i)=>{let b=document.createElement('button');b.className='scene'+(i===active?' active':'');b.innerHTML='<span class="num">'+(i+1)+'</span><span><b>'+esc(s.name)+'</b><br><span class="muted">'+esc(s.type)+'</span></span>';b.onclick=()=>{active=i;refresh()};$('sceneList').append(b);let t=document.createElement('button');t.className='tile'+(i===active?' active':'');t.innerHTML='<b>'+(i+1)+'. '+esc(s.name)+'</b><span class="muted">'+(+s.duration||5)+' Sek.</span>';t.onclick=()=>{active=i;refresh()};$('timeline').append(t)});$('duration').textContent='Gesamtlänge: '+scenes.reduce((n,s)=>n+(+s.duration||5),0)+' Sek.'}
function field(label,key,value,type='text'){return '<div class="field"><label>'+label+'</label><input type="'+type+'" data-key="'+key+'" value="'+esc(value)+'"></div>'}
function area(label,key,value){return '<div class="field"><label>'+label+'</label><textarea data-key="'+key+'">'+esc(value)+'</textarea></div>'}
function editor(){let s=cur(),h='<div class="field"><label>SZONENTYP</label><select id="kind">'+Object.keys(templates).map(k=>'<option value="'+k+'">'+templates[k].name+'</option>').join('')+'</select></div>'+field('SZENENNAME','name',s.name)+field('EYEBROW','eyebrow',s.eyebrow)+field('TITEL','title',s.title)+field('DAUER (SEK.)','duration',s.duration,'number');if(s.type==='hook'||s.type==='prediction'||s.type==='tactics')h+=area('TEXT','body',s.body);if(s.type==='stats'){h+=field('TEAM LINKS','teamA',s.teamA)+field('TEAM RECHTS','teamB',s.teamB)+'<div class="section">Statistikwerte</div>'+(s.stats||[]).map((r,i)=>'<div class="grid2"><div class="field"><label>'+esc(r[0])+'</label><input data-stat="'+i+'-1" value="'+esc(r[1])+'"></div><div class="field"><label>Vergleich</label><input data-stat="'+i+'-2" value="'+esc(r[2])+'"></div></div>').join('')}if(s.type==='tactics')h+=field('FORMATION BLAU','formationA',s.formationA)+field('FORMATION WEISS','formationB',s.formationB);if(s.type==='player')h+=field('SPIELER','player',s.player)+field('POSITION / ROLLE','role',s.role)+field('STATISTIK 1','stat1',s.stat1)+field('STATISTIK 2','stat2',s.stat2)+area('EINORDNUNG','body',s.body);if(s.type==='prediction')h+='<div class="section">Wahrscheinlichkeiten (%)</div>'+field('Heimsieg','home',s.home,'number')+field('Remis','draw',s.draw,'number')+field('Auswärtssieg','away',s.away,'number');h+='<div class="actions"><button id="up">↑</button><button id="down">↓</button><button id="del" class="danger">Szene löschen</button></div><div class="hint">Daten und Prognosen selbst prüfen. TOUCHLINE STUDIO bezieht aktuell keine Live- oder Trackingdaten.</div>';$('editor').innerHTML=h;$('kind').value=s.type;$('editor').querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{s[el.dataset.key]=el.type==='number'?+el.value:el.value;lists();render()});$('editor').querySelectorAll('[data-stat]').forEach(el=>el.oninput=()=>{let [i,j]=el.dataset.stat.split('-').map(Number);s.stats[i][j]=el.value;render()});$('kind').onchange=e=>{let n=structuredClone(templates[e.target.value]);n.name=s.name;scenes[active]=n;refresh()};$('up').onclick=()=>move(-1);$('down').onclick=()=>move(1);$('del').onclick=()=>{if(scenes.length>1){scenes.splice(active,1);active=Math.max(0,active-1);refresh()}}}
function move(d){let n=active+d;if(n<0||n>=scenes.length)return;[scenes[active],scenes[n]]=[scenes[n],scenes[active]];active=n;refresh()}
function refresh(){lists();editor();render()}
$('add').onclick=()=>{scenes.push(structuredClone(templates.hook));active=scenes.length-1;refresh()};$('duplicate').onclick=()=>{scenes.splice(active+1,0,structuredClone(cur()));active++;refresh()};$('prev').onclick=()=>{active=Math.max(0,active-1);refresh()};$('next').onclick=()=>{active=Math.min(scenes.length-1,active+1);refresh()};$('projectTitle').oninput=render;$('projectSub').oninput=render;
$('new').onclick=()=>{if(confirm('Neues Projekt starten?')){scenes=structuredClone([templates.hook,templates.stats,templates.tactics,templates.player,templates.prediction]);active=0;$('projectTitle').value='MATCH ANALYSIS';refresh()}};
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
$('save').onclick=()=>download(new Blob([JSON.stringify({title:$('projectTitle').value,sub:$('projectSub').value,scenes},null,2)],{type:'application/json'}),'touchline-project.json');
$('load').onclick=()=>{let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{let d=JSON.parse(await i.files[0].text());if(!Array.isArray(d.scenes))throw Error();scenes=d.scenes;active=0;$('projectTitle').value=d.title||'';$('projectSub').value=d.sub||'';refresh();$('status').textContent='Projekt geladen.'}catch{$('status').textContent='Ungültige Projektdatei.'}};i.click()};
let playTimer; $('play').onclick=()=>{if(playing){playing=false;clearTimeout(playTimer);$('play').textContent='▶ Vorschau';return}playing=true;$('play').textContent='Ⅱ Stop';let step=()=>{if(!playing)return;render();playTimer=setTimeout(()=>{active=(active+1)%scenes.length;lists();editor();step()},(+cur().duration||5)*1000)};step()};
$('export').onclick=async()=>{let btn=$('export');btn.disabled=true;$('status').textContent='Export läuft. Tab geöffnet lassen …';try{let stream=c.captureStream(30),mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));let rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:6000000}:{}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};let done=new Promise(r=>rec.onstop=r);rec.start();for(let i=0;i<scenes.length;i++){active=i;lists();editor();render();await new Promise(r=>setTimeout(r,(+cur().duration||5)*1000))}rec.stop();await done;stream.getTracks().forEach(t=>t.stop());download(new Blob(chunks,{type:rec.mimeType||'video/webm'}),'touchline-studio.webm');$('status').textContent='Export abgeschlossen: WebM. MP4-Konvertierung ist in dieser Browser-Version nicht integriert.'}catch(e){$('status').textContent='Export fehlgeschlagen: '+e.message}finally{btn.disabled=false;refresh()}};
refresh();
</script></body></html>
