<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1118"><title>TOUCHLINE STUDIO</title>
<style>:root{color-scheme:dark;--bg:#080d12;--panel:#111a22;--line:#263642;--muted:#8fa2af;--text:#f4f7f8;--lime:#c8f169;--blue:#77b9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1b2a32 0,#080d12 52%);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{border:1px solid #344653;background:#1a2731;color:var(--text);padding:10px 13px;border-radius:10px;cursor:pointer;font-weight:750;transition:.18s}button:hover{border-color:var(--lime);transform:translateY(-1px)}button.primary{background:var(--lime);color:#10160a;border-color:var(--lime)}button:disabled{opacity:.45;cursor:not-allowed}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,3vw,42px);border-bottom:1px solid #26343e;background:#0a1118ee;position:sticky;top:0;z-index:3;backdrop-filter:blur(18px)}.logo{font-weight:1000;letter-spacing:.15em;font-size:15px}.logo span{color:var(--lime)}.tag{font-size:10px;color:var(--lime);border:1px solid #556b32;border-radius:30px;padding:6px 10px;margin-right:8px;letter-spacing:.12em;font-weight:900}.layout{max-width:1800px;margin:auto;padding:18px;display:grid;grid-template-columns:270px minmax(340px,1fr) 330px;gap:16px;min-height:calc(100vh - 70px)}.panel{background:linear-gradient(145deg,#15212b,#101820);border:1px solid #293b47;border-radius:16px;overflow:hidden;box-shadow:0 18px 50px #0003}.head{padding:15px 17px;border-bottom:1px solid #293b47;font-size:10px;letter-spacing:.16em;font-weight:950;color:#b9c9d1}.pad{padding:16px}.field{margin-bottom:13px}.field label{display:block;font-size:10px;letter-spacing:.1em;color:#a9bbc6;font-weight:900;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #344753;background:#0b131a;color:var(--text);padding:11px;border-radius:9px;outline:none}.field textarea{min-height:84px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--lime);box-shadow:0 0 0 3px #c8f16918}.muted{color:var(--muted);font-size:11px}.scene{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:8px;background:#101a22;border-color:#263945}.scene.active{border-color:var(--lime);background:#202b1b;box-shadow:inset 3px 0 var(--lime)}.num{background:#2b3b45;border-radius:7px;padding:6px 8px;color:var(--lime);font-size:11px;font-weight:900}.main{min-width:0;display:flex;flex-direction:column;gap:14px}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.bar b{font-size:15px}.stage{background:radial-gradient(ellipse at 50% 40%,#243640,#101820 70%);border:1px solid #2a3c47;border-radius:17px;min-height:620px;display:flex;justify-content:center;align-items:center;padding:20px;position:relative;overflow:hidden}.stage:before{content:"";position:absolute;inset:14px;border:1px solid #ffffff0a;border-radius:12px;pointer-events:none}canvas{width:min(100%,360px);height:auto;aspect-ratio:9/16;border-radius:12px;background:#101820;box-shadow:0 22px 65px #000b,0 0 0 1px #ffffff1c}.timeline{display:flex;gap:8px;overflow:auto;padding:12px 0}.tile{min-width:122px;text-align:left;font-size:11px;background:#101a22;border-color:#293c47}.tile.active{border-color:var(--lime);background:#202b1b}.tile b{display:block;margin-bottom:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.section{font-size:10px;letter-spacing:.15em;color:#9db0bb;font-weight:950;margin:19px 0 10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{font-size:11px;color:#c4d2d8;min-height:20px;margin-top:9px}.danger{color:#ff9eaa}.hint{padding:12px;background:#1b2818;border:1px solid #4b6031;border-radius:10px;font-size:11px;color:#d7e9b8}.right .pad,.left .pad{max-height:calc(100vh - 120px);overflow:auto}@media(max-width:1150px){.layout{grid-template-columns:230px minmax(300px,1fr)}.right{grid-column:1/-1}.right .pad{max-height:none;display:grid;grid-template-columns:1fr 1fr;gap:0 16px}}@media(max-width:740px){header{height:60px;padding:0 12px}.logo{font-size:12px}.tag{display:none}.layout{display:flex;flex-direction:column;padding:8px;gap:10px}.main{order:1}.left{order:2}.right{order:3}.stage{min-height:0;padding:10px}.right .pad{display:block}.left .pad{max-height:none}canvas{width:min(100%,320px)}.bar .muted{font-size:10px}}</style></head><body>
<header><div class="logo">TOUCHLINE <span>STUDIO</span></div><div><span class="tag">BETA · LOKAL</span><button id="new">Neues Projekt</button></div></header>
<div class="layout">
<aside class="panel left"><div class="head">PROJEKT & SZENEN</div><div class="pad">
<div class="field"><label>VIDEOTITEL</label><input id="projectTitle" value="MATCH ANALYSIS"></div><div class="field"><label>UNTERTITEL</label><input id="projectSub" value="TACTICAL BREAKDOWN"></div>
<div class="section">Szenen</div><div id="sceneList"></div><div class="actions"><button class="primary" id="add">+ Szene</button><button id="duplicate">Kopieren</button></div>
<div class="section">Hinweis</div><p class="muted">Alle Inhalte werden lokal im Browser bearbeitet. Statistikwerte sind manuelle Eingaben und müssen vor Veröffentlichung geprüft und belegt werden.</p>
</div></aside>
<main class="main"><div class="bar"><div><b>Videovorschau</b><div class="muted">9:16 · 1080 × 1920 · TikTok / Reels / Shorts</div></div><div class="actions"><button id="prev">←</button><button id="next">→</button><button id="play">▶ Vorschau</button></div></div>
<div class="stage"><canvas id="canvas" width="1080" height="1920"></canvas></div>
<div class="panel pad"><div class="bar"><b>Timeline</b><span class="muted" id="duration"></span></div><div class="timeline" id="timeline"></div><div class="actions"><button class="primary" id="export">Video exportieren (WebM)</button><button id="save">Projekt exportieren</button><button id="load">Projekt importieren</button></div><div class="status" id="status"></div></div></main>
<aside class="panel right"><div class="head">SZENE BEARBEITEN</div><div class="pad" id="editor"></div></aside>
</div>
<script>
const templates={
hook:{type:'hook',name:'Hook',eyebrow:'MATCHDAY',title:'DIESES DUELL ENTSCHEIDET DAS SPIEL',body:'Welche Mannschaft kontrolliert die entscheidenden Räume?',duration:5},
stats:{type:'stats',name:'Statistikvergleich',eyebrow:'DIE ZAHLEN',title:'WER HAT DEN VORTEIL?',teamA:'HEIMTEAM',teamB:'AUSWÄRTSTEAM',stats:[['xG','0,0','0,0'],['Torschüsse','0','0'],['Ballbesitz','0 %','0 %'],['Passquote','0 %','0 %']],duration:7},
tactics:{type:'tactics',name:'Taktiktafel',eyebrow:'TAKTIK-CHECK',title:'RÄUME ZWISCHEN DEN LINIEN',body:'Formation und Laufwege beschreiben. Datenquelle und Spielsituation ergänzen.',formationA:'4-2-3-1',formationB:'4-3-3',duration:8},
player:{type:'player',name:'Spieler im Fokus',eyebrow:'PLAYER SPOTLIGHT',title:'DER SCHLÜSSELSPIELER',player:'SPIELERNAME',role:'ROLLE / POSITION',stat1:'0 Key Passes',stat2:'0 erfolgreiche Dribblings',body:'Einordnung: Stärken, Schwächen und taktische Aufgabe.',duration:7},
prediction:{type:'prediction',name:'Prognose',eyebrow:'UNSERE EINSCHÄTZUNG',title:'WIE KÖNNTE DAS SPIEL LAUFEN?',body:'Begründete Prognose auf Basis der gezeigten Daten.',home:40,draw:30,away:30,duration:6}
};
let scenes=structuredClone([templates.hook,templates.stats,templates.tactics,templates.player,templates.prediction]),active=0,playing=false;
const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d');
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const cur=()=>scenes[active];
function rr(x,y,w,h,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function txt(s,x,y,size,col='#f2f6f8',weight=800,align='left'){ctx.fillStyle=col;ctx.font=weight+' '+size+'px Inter,system-ui,sans-serif';ctx.textAlign=align;ctx.fillText(String(s??''),x,y)}
function wrap(s,x,y,max,size,col='#f2f6f8',weight=850){ctx.font=weight+' '+size+'px Inter,system-ui';ctx.fillStyle=col;ctx.textAlign='left';let line='',yy=y;for(const w of String(s??'').split(/\s+/)){let t=line+w+' ';if(ctx.measureText(t).width>max&&line){ctx.fillText(line.trim(),x,yy);line=w+' ';yy+=size*1.18}else line=t}if(line)ctx.fillText(line.trim(),x,yy);return yy}
function pill(s,x,y,w){rr(x,y,w,42,21,'#c8f169');txt(s,x+w/2,y+27,17,'#10160a',950,'center')}
function bg(){let g=ctx.createLinearGradient(0,0,1080,1920);g.addColorStop(0,'#101c25');g.addColorStop(.52,'#0b1219');g.addColorStop(1,'#18251d');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1920);ctx.fillStyle='#c8f169';ctx.globalAlpha=.08;ctx.beginPath();ctx.arc(1010,220,430,0,7);ctx.fill();ctx.beginPath();ctx.arc(30,1680,380,0,7);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#ffffff0c';ctx.lineWidth=2;for(let x=0;x<1080;x+=90){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,1920);ctx.stroke()}}
function chrome(){rr(70,72,940,3,2,'#c8f169');txt('TOUCHLINE',72,130,25,'#f5f7f5',1000);txt('STUDIO  /  FOOTBALL INTELLIGENCE',260,130,18,'#9aadb8',700);rr(72,1740,936,2,1,'#ffffff22');txt(($('projectTitle').value||'MATCH ANALYSIS').toUpperCase(),72,1800,22,'#c8f169',950);txt(String(active+1).padStart(2,'0')+'  /  '+String(scenes.length).padStart(2,'0'),1008,1800,22,'#dce5e8',850,'right');rr(72,1830,936,7,4,'#293942');rr(72,1830,936*(active+1)/scenes.length,7,4,'#c8f169')}
function pitch(){rr(72,680,936,850,24,'#0c543b');ctx.strokeStyle='#d6f2df';ctx.globalAlpha=.7;ctx.lineWidth=4;ctx.strokeRect(110,715,860,780);ctx.beginPath();ctx.moveTo(540,715);ctx.lineTo(540,1495);ctx.stroke();ctx.beginPath();ctx.arc(540,1105,115,0,7);ctx.stroke();ctx.strokeRect(315,715,450,145);ctx.strokeRect(315,1350,450,145);ctx.globalAlpha=1;[[280,880],[440,850],[610,850],[790,880],[380,1080],[700,1080],[250,1300],[430,1330],[650,1330],[830,1300]].forEach((p,i)=>{ctx.fillStyle=i<4?'#77b9ff':'#f7f8f4';ctx.beginPath();ctx.arc(p[0],p[1],25,0,7);ctx.fill();ctx.strokeStyle='#07130f';ctx.lineWidth=4;ctx.stroke()});ctx.strokeStyle='#c8f169';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(440,850);ctx.quadraticCurveTo(520,970,650,1010);ctx.stroke();ctx.beginPath();ctx.moveTo(620,990);ctx.lineTo(650,1010);ctx.lineTo(620,1030);ctx.stroke()}
function render(progress=1){let s=cur();bg();chrome();pill((s.eyebrow||'ANALYSIS').toUpperCase(),72,210,Math.min(360,Math.max(190,(s.eyebrow||'ANALYSIS').length*13+48)));let reveal=Math.min(1,Math.max(0,progress*2.4));ctx.save();ctx.globalAlpha=reveal;ctx.translate((1-reveal)*38,0);wrap((s.title||'').toUpperCase(),72,390,920,76,'#f5f7f4',1000);ctx.restore();
if(s.type==='hook'){txt('THE MATCH',76,800,25,'#c8f169',950);wrap(s.body,76,880,820,42,'#d0dbe0',650);rr(72,1190,936,360,26,'#1b2b34');txt('THE QUESTION',112,1270,20,'#91a5b0',900);wrap('WER GEWINNT DIE ENTSCHEIDENDEN RÄUME?',112,1370,820,48,'#fff',950);rr(72,1600,18,72,8,'#c8f169')}
if(s.type==='stats'){txt(s.teamA||'TEAM A',100,640,27,'#77b9ff',950);txt(s.teamB||'TEAM B',980,640,27,'#c8f169',950,'right');(s.stats||[]).forEach((r,i)=>{let py=750+i*215;rr(72,py-78,936,165,20,'#182630');txt(r[0].toUpperCase(),110,py-27,20,'#a8bac4',900);txt(r[1],110,py+45,48,'#77b9ff',950);txt(r[2],970,py+45,48,'#c8f169',950,'right');let a=parseFloat(String(r[1]).replace(',','.'))||0,b=parseFloat(String(r[2]).replace(',','.'))||0,den=Math.max(a,b,1),bar=Math.max(0,Math.min(1,progress*1.3));rr(110,py+65,860,9,5,'#30414b');rr(110,py+65,860*a/den*bar,9,5,'#77b9ff');rr(110,py+83,860*b/den*bar,9,5,'#c8f169')})}
if(s.type==='tactics'){txt('BLAU  '+(s.formationA||''),90,630,25,'#77b9ff',950);txt('WEISS  '+(s.formationB||''),990,630,25,'#f5f7f4',950,'right');pitch();wrap(s.body,90,1610,900,31,'#d0dbe0',650)}
if(s.type==='player'){rr(72,650,936,900,28,'#182630');ctx.fillStyle='#253a43';ctx.beginPath();ctx.arc(770,970,300,0,7);ctx.fill();ctx.fillStyle='#c8f169';ctx.beginPath();ctx.arc(770,850,92,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(770,1190,190,250,0,Math.PI,0);ctx.fill();txt('PLAYER FOCUS',112,760,21,'#c8f169',950);wrap((s.player||'PLAYER').toUpperCase(),112,900,550,58,'#fff',1000);txt((s.role||'ROLE / POSITION').toUpperCase(),112,965,22,'#9db1bc',850);rr(112,1080,370,112,16,'#263944');txt(s.stat1||'',138,1150,25,'#77b9ff',900);rr(112,1220,370,112,16,'#263944');txt(s.stat2||'',138,1290,23,'#c8f169',900);wrap(s.body,112,1430,780,28,'#d0dbe0',650)}
if(s.type==='prediction'){wrap(s.body,80,620,880,33,'#cbd8de',650);let vals=[+s.home||0,+s.draw||0,+s.away||0],labs=['HEIMSIEG','REMIS','AUSWÄRTSSIEG'];vals.forEach((v,i)=>{let yy=880+i*220;txt(labs[i],90,yy,24,'#c5d2d8',950);txt(v+'%',990,yy,36,'#fff',950,'right');rr(90,yy+35,900,24,12,'#2a3b45');rr(90,yy+35,900*Math.max(0,Math.min(100,v))/100*Math.min(1,progress*1.5),24,12,['#77b9ff','#b8c5cb','#c8f169'][i])})}
if($('projectSub').value){ctx.save();ctx.globalAlpha=.8;txt($('projectSub').value.toUpperCase(),72,1710,18,'#d4e0e4',750);ctx.restore()}
rr(72,1870,936,6,3,'#293942');rr(72,1870,936*Math.max(.03,Math.min(1,progress)),6,3,'#c8f169');
}
function lists(){$('sceneList').innerHTML='';$('timeline').innerHTML='';scenes.forEach((s,i)=>{let b=document.createElement('button');b.className='scene'+(i===active?' active':'');b.innerHTML='<span class="num">'+(i+1)+'</span><span><b>'+esc(s.name)+'</b><br><span class="muted">'+esc(s.type)+'</span></span>';b.onclick=()=>{active=i;refresh()};$('sceneList').append(b);let t=document.createElement('button');t.className='tile'+(i===active?' active':'');t.innerHTML='<b>'+(i+1)+'. '+esc(s.name)+'</b><span class="muted">'+(+s.duration||5)+' Sek.</span>';t.onclick=()=>{active=i;refresh()};$('timeline').append(t)});$('duration').textContent='Gesamtlänge: '+scenes.reduce((n,s)=>n+(+s.duration||5),0)+' Sek.'}
function field(label,key,value,type='text'){return '<div class="field"><label>'+label+'</label><input type="'+type+'" data-key="'+key+'" value="'+esc(value)+'"></div>'}
function area(label,key,value){return '<div class="field"><label>'+label+'</label><textarea data-key="'+key+'">'+esc(value)+'</textarea></div>'}
function editor(){let s=cur(),h='<div class="field"><label>SZONENTYP</label><select id="kind">'+Object.keys(templates).map(k=>'<option value="'+k+'">'+templates[k].name+'</option>').join('')+'</select></div>'+field('SZENENNAME','name',s.name)+field('EYEBROW','eyebrow',s.eyebrow)+field('TITEL','title',s.title)+field('DAUER (SEK.)','duration',s.duration,'number');if(s.type==='hook'||s.type==='prediction'||s.type==='tactics')h+=area('TEXT','body',s.body);if(s.type==='stats'){h+=field('TEAM LINKS','teamA',s.teamA)+field('TEAM RECHTS','teamB',s.teamB)+'<div class="section">Statistikwerte</div>'+(s.stats||[]).map((r,i)=>'<div class="grid2"><div class="field"><label>'+esc(r[0])+'</label><input data-stat="'+i+'-1" value="'+esc(r[1])+'"></div><div class="field"><label>Vergleich</label><input data-stat="'+i+'-2" value="'+esc(r[2])+'"></div></div>').join('')}if(s.type==='tactics')h+=field('FORMATION BLAU','formationA',s.formationA)+field('FORMATION WEISS','formationB',s.formationB);if(s.type==='player')h+=field('SPIELER','player',s.player)+field('POSITION / ROLLE','role',s.role)+field('STATISTIK 1','stat1',s.stat1)+field('STATISTIK 2','stat2',s.stat2)+area('EINORDNUNG','body',s.body);if(s.type==='prediction')h+='<div class="section">Wahrscheinlichkeiten (%)</div>'+field('Heimsieg','home',s.home,'number')+field('Remis','draw',s.draw,'number')+field('Auswärtssieg','away',s.away,'number');h+='<div class="actions"><button id="up">↑</button><button id="down">↓</button><button id="del" class="danger">Szene löschen</button></div><div class="hint">Daten und Prognosen selbst prüfen. TOUCHLINE STUDIO bezieht aktuell keine Live- oder Trackingdaten.</div>';$('editor').innerHTML=h;$('kind').value=s.type;$('editor').querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{s[el.dataset.key]=el.type==='number'?+el.value:el.value;lists();render()});$('editor').querySelectorAll('[data-stat]').forEach(el=>el.oninput=()=>{let [i,j]=el.dataset.stat.split('-').map(Number);s.stats[i][j]=el.value;render()});$('kind').onchange=e=>{let n=structuredClone(templates[e.target.value]);n.name=s.name;scenes[active]=n;refresh()};$('up').onclick=()=>move(-1);$('down').onclick=()=>move(1);$('del').onclick=()=>{if(scenes.length>1){scenes.splice(active,1);active=Math.max(0,active-1);refresh()}}}
function move(d){let n=active+d;if(n<0||n>=scenes.length)return;[scenes[active],scenes[n]]=[scenes[n],scenes[active]];active=n;refresh()}
function refresh(){lists();editor();render()}
$('add').onclick=()=>{scenes.push(structuredClone(templates.hook));active=scenes.length-1;refresh()};$('duplicate').onclick=()=>{scenes.splice(active+1,0,structuredClone(cur()));active++;refresh()};$('prev').onclick=()=>{active=Math.max(0,active-1);refresh()};$('next').onclick=()=>{active=Math.min(scenes.length-1,active+1);refresh()};$('projectTitle').oninput=render;$('projectSub').oninput=render;
$('new').onclick=()=>{if(confirm('Neues Projekt starten?')){scenes=structuredClone([templates.hook,templates.stats,templates.tactics,templates.player,templates.prediction]);active=0;$('projectTitle').value='MATCH ANALYSIS';refresh()}};
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
$('save').onclick=()=>download(new Blob([JSON.stringify({title:$('projectTitle').value,sub:$('projectSub').value,scenes},null,2)],{type:'application/json'}),'touchline-project.json');
$('load').onclick=()=>{let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{let d=JSON.parse(await i.files[0].text());if(!Array.isArray(d.scenes))throw Error();scenes=d.scenes;active=0;$('projectTitle').value=d.title||'';$('projectSub').value=d.sub||'';refresh();$('status').textContent='Projekt geladen.'}catch{$('status').textContent='Ungültige Projektdatei.'}};i.click()};
let playTimer; $('play').onclick=()=>{if(playing){playing=false;clearTimeout(playTimer);$('play').textContent='▶ Vorschau';return}playing=true;$('play').textContent='Ⅱ Stop';let step=()=>{if(!playing)return;render();playTimer=setTimeout(()=>{active=(active+1)%scenes.length;lists();editor();step()},(+cur().duration||5)*1000)};step()};
$('export').onclick=async()=>{let btn=$('export');btn.disabled=true;$('status').textContent='Animierter Export läuft. Tab geöffnet lassen …';try{let stream=c.captureStream(30),mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!window.MediaRecorder)throw Error('Dieser Browser unterstützt keinen Videoexport.');let rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:8000000}:{}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};let done=new Promise(r=>rec.onstop=r);rec.start();for(let i=0;i<scenes.length;i++){active=i;lists();editor();let duration=Math.max(3,+cur().duration||5),start=performance.now();await new Promise(resolve=>{function frame(now){let p=Math.min(1,(now-start)/(duration*1000));render(p);if(p<1)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)})}rec.stop();await done;stream.getTracks().forEach(t=>t.stop());download(new Blob(chunks,{type:rec.mimeType||'video/webm'}),'touchline-studio.webm');$('status').textContent='Animierter WebM-Export abgeschlossen. MP4-Konvertierung ist noch nicht integriert.'}catch(e){$('status').textContent='Export fehlgeschlagen: '+e.message}finally{btn.disabled=false;refresh()}};
function persist(){try{localStorage.setItem('touchline-studio-project',JSON.stringify({title:$('projectTitle').value,sub:$('projectSub').value,scenes}))}catch(e){}}
function restore(){try{let raw=localStorage.getItem('touchline-studio-project');if(!raw)return;let d=JSON.parse(raw);if(Array.isArray(d.scenes)&&d.scenes.length){scenes=d.scenes;active=0;$('projectTitle').value=d.title||'MATCH ANALYSIS';$('projectSub').value=d.sub||''}}catch(e){}}
restore();refresh();$('projectTitle').addEventListener('input',persist);$('projectSub').addEventListener('input',()=>{render();persist()});document.addEventListener('input',e=>{if(e.target.matches('#editor input,#editor textarea,#editor select'))persist()});document.addEventListener('click',e=>{if(e.target.closest('#add,#duplicate,#up,#down,#del,#new'))setTimeout(persist,0)});
</script></body></html>
